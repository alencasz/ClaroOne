<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Claro One — continuidade de contexto entre canais">
  <title>{% block title %}Claro One{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/global.css') }}?v=20260904.2">
  {% block styles %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', path='/css/context-taxonomy.css') }}?v=20260904.2">
</head>
<body data-page="{{ page }}">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Claro One — início">
      <span class="brand-mark">C1</span>
      <span><strong>CLARO</strong> ONE</span>
    </a>
    <nav class="topnav" aria-label="Sistema interno">
      <a href="/atendente" class="{% if page == 'atendente' %}active{% endif %}">Cockpit</a>
    </nav>
  </header>

  {% if demo_fallback %}
  <div class="fallback-banner">MODO FALLBACK DE DEMONSTRAÇÃO — resultados simulados estão explicitamente ativos</div>
  {% endif %}

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <span>CLARO ONE</span>
    <span>Protótipo acadêmico — dados fictícios</span>
  </footer>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="{{ url_for('static', path='/js/common.js') }}?v=20260904.2"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
